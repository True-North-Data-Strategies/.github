name: Bug report
description: Describe a reproducible problem using fictional data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Search existing work first. Do not include credentials, customer records or confidential client details. Report sensitive security findings using SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened and what should happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Safe steps to reproduce
      description: Use fictional inputs and include the affected version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Checks and remaining questions
      description: Include only sanitized evidence and note anything unverified.
